<body>
    <h1>Maggie recipe</h1>
<img src="maggie.png" alt="maggie"></img>
<h2>Ingredients</h2>
<ul>
    <li>Maggi noodles</li>
    <li>Water</li>
    <li>Maggi masala</li>
    <li>Vegetables</li>
</ul>
<h2>Instructions</h2>
<ol>
    <li>Boil water in a pan.</li>
    <li>Add noodles and masala.</li>
    <li>Add vegetables.</li>
    <li>Cook for 2-3 minutes.</li>
    <li>Serve hot.</li>
</ol>
<p>Maggi is a quick and tasty snack.</p>

<p><strong>Tip:</strong> Add your favourite vegetables.</p>
